    <div id="devtopBar"><span>powered by <b>DevTop</b></span><a id="devtopGo" href="#" target="_blank" rel="noopener">Go to our page</a><button type="button" id="devtopPostBtn" onclick="devtopPost()" style="display:none">Post</button><button type="button" id="devtopDash" onclick="devtopToggle()" aria-label="More" style="border-color:transparent;padding:4px 8px;letter-spacing:0">&mdash;</button></div>
    <script>
      // === powered by DevTop ===
      var DEVTOP_URL = 'https://devtopmainsite.vercel.app/';
      var DEVTOP_FB = { apiKey: "AIzaSyACcnVhADOiOPfUoTHJ0BpoPUfdcDAzbhM", authDomain: "minecraft-6b1cf.firebaseapp.com", projectId: "minecraft-6b1cf", appId: "1:98905567336:web:264b626e554ce34bd54bdd" };
      var DEVTOP_CODE_HASH = '65fad89bde198d97d044d9fd9d532a46d43b8df055efee0bff0778741c7d539c';
      async function devtopSha(t) { var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join(''); }
      var DEVTOP_SITE = { name: 'Airtrohp', description: 'Premium AI coding assistant platform' };
      (function () { var a = document.getElementById('devtopGo'); if (a) a.href = DEVTOP_URL; })();
      function devtopToggle() { var b = document.getElementById('devtopPostBtn'); if (b) b.style.display = b.style.display === 'none' ? '' : 'none'; }
      function devtopPost() {
        if (document.getElementById('devtopModal')) return;
        var o = document.createElement('div'); o.id = 'devtopModal';
        o.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px';
        o.innerHTML = '<form style="background:#0a0a0a;color:#f5f5f5;border:1px solid #333;border-radius:14px;padding:22px;width:min(92vw,340px);font-family:inherit" autocomplete="off">' +
          '<div style="font-weight:700;margin-bottom:4px">Post to DevTop</div>' +
          '<div style="font-size:12px;color:#aaa;margin-bottom:14px">Enter the code to add this site to your DevTop hub.</div>' +
          '<input type="password" id="devtopPw" placeholder="Code" required style="width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;font-size:16px">' +
          '<div id="devtopMsg" style="min-height:18px;font-size:12px;margin:10px 0;color:#ff8a8a"></div>' +
          '<div style="display:flex;gap:8px"><button type="button" id="devtopCancel" style="flex:1;padding:10px;border-radius:8px;border:1px solid #444;background:transparent;color:#fff;cursor:pointer">Cancel</button>' +
          '<button type="submit" id="devtopSend" style="flex:1;padding:10px;border-radius:8px;border:0;background:#f5f5f5;color:#000;font-weight:700;cursor:pointer">Post</button></div></form>';
        document.body.appendChild(o);
        var pw = o.querySelector('#devtopPw'), msg = o.querySelector('#devtopMsg'), send = o.querySelector('#devtopSend');
        pw.focus();
        o.querySelector('#devtopCancel').onclick = function () { o.remove(); };
        o.querySelector('form').onsubmit = async function (e) {
          e.preventDefault(); msg.style.color = '#ff8a8a'; msg.textContent = ''; send.disabled = true;
          try {
            if ((await devtopSha(pw.value.trim())) !== DEVTOP_CODE_HASH) { msg.textContent = 'Wrong code.'; send.disabled = false; return; }
            var V = '10.12.2', B = 'https://www.gstatic.com/firebasejs/' + V + '/';
            var A = await import(B + 'firebase-app.js'), AU = await import(B + 'firebase-auth.js'), FS = await import(B + 'firebase-firestore.js');
            var app = A.getApps().filter(function (x) { return x.name === 'devtop'; })[0] || A.initializeApp(DEVTOP_FB, 'devtop');
            var auth = AU.getAuth(app), db = FS.getFirestore(app);
            await AU.signInAnonymously(auth);
            var url = location.origin + '/';
            var ex = await FS.getDocs(FS.query(FS.collection(db, 'devtop_sites'), FS.where('url', '==', url)));
            if (!ex.empty) { msg.textContent = 'This site is already on DevTop.'; }
            else {
              await FS.addDoc(FS.collection(db, 'devtop_sites'), { name: DEVTOP_SITE.name, url: url, description: DEVTOP_SITE.description, color: '#ffffff', createdAt: FS.serverTimestamp() });
              msg.style.color = '#9be8b5'; msg.textContent = 'Posted to DevTop!';
            }
            await AU.signOut(auth);
            if (!ex.empty) { send.disabled = false; return; }
            setTimeout(function () { o.remove(); }, 1400);
          } catch (err) {
            var c = err && err.code || '';
            msg.textContent = /permission-denied/.test(c) ? 'DevTop does not allow posting yet (update its Firestore rules).' : /too-many/.test(c) ? 'Too many attempts. Try later.' : 'Error: ' + (c || err.message);
            send.disabled = false;
          }
        };
      }
